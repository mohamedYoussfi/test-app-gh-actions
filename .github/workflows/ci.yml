name: CI et déploiement Spring Boot

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spring-docker-demo-deploy
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: [self-hosted, linux]
    env:
      IMAGE: spring-docker-demo:${{ github.sha }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler, tester et empaqueter
        run: mvn -B clean package

      - name: Construire l’image Docker
        run: docker build --tag "$IMAGE" .

      - name: Déployer le conteneur
        id: deploy
        run: |
          if docker container inspect demo >/dev/null 2>&1; then
            docker rm -f demo
          fi

          docker run -d \
            --name demo \
            --restart unless-stopped \
            -p 127.0.0.1:8080:8080 \
            "$IMAGE"

      - name: Vérifier GET /test
        run: |
          for attempt in {1..30}; do
            if response=$(curl -fsS --max-time 2 http://127.0.0.1:8080/test 2>/dev/null) &&
               [[ "$response" == 'Hello Mohamed' ]]; then
              echo "Réponse attendue reçue : $response"
              exit 0
            fi
            sleep 1
          done

          echo "::error::GET /test ne renvoie pas la réponse attendue"
          exit 1

      - name: Afficher les logs en cas d’échec du déploiement
        if: ${{ failure() && steps.deploy.outcome != 'skipped' }}
        run: docker logs --tail 100 demo || true